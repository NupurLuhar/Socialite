<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Social Media</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="home-container">
        <h1 class="feed-title">Home Feed</h1>
        <!-- Post 1 -->
        <div class="post">
            <div class="post-header">
                <img class="profile-img" src="default-profile.jpg" alt="User" />
                <h3 class="username">John Doe</h3>
            </div>
            <p class="post-content">This is a post</p>
            <img class="post-image" src="post-image.jpg" alt="Post" />
        </div>

        <!-- Post 2 -->
        <div class="post">
            <div class="post-header">
                <img class="profile-img" src="default-profile.jpg" alt="User" />
                <h3 class="username">Jane Smith</h3>
            </div>
            <p class="post-content">Another post</p>
        </div>
    </div>
</body>

</html>
